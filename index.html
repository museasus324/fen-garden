<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ふぇんの書庫</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#8cbff2;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .panel { background:rgba(13,15,41,.92); border:2px solid #f2f2f2; border-radius:6px; color:#fff; }
  #hud { position:fixed; top:12px; left:14px; padding:10px 14px; pointer-events:none; z-index:5; }
  #hud .t { font-size:22px; color:#f2f5ff; }
  #hud .c { font-size:18px; color:#d9e0ff; margin-top:2px; }
  #hint { position:fixed; left:16px; bottom:14px; font-size:16px; color:#fff;
    text-shadow:1px 1px 2px rgba(0,0,0,.8); pointer-events:none; z-index:5; }
  #prompt { position:fixed; left:50%; bottom:110px; transform:translateX(-50%);
    padding:10px 18px; font-size:20px; display:none; pointer-events:none; z-index:5; }
  #toast { position:fixed; left:50%; top:64px; transform:translateX(-50%); font-size:22px;
    color:#fff2b3; text-shadow:1px 1px 3px rgba(0,0,0,.85); display:none; z-index:6;
    white-space:nowrap; pointer-events:none; }
  #detail { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(580px,92vw); padding:18px 20px; display:none; z-index:10; box-sizing:border-box; }
  #detail h1 { font-size:30px; margin:0 0 4px; font-weight:600; }
  #detail .genre { font-size:16px; color:#b3ccff; margin-bottom:10px; }
  #detail .desc { font-size:18px; color:#ebecff; line-height:1.55; }
  #detail .fen { font-size:17px; color:#ffd98c; line-height:1.55; margin-top:10px; }
  #detail .row { margin-top:16px; display:flex; gap:12px; }
  #detail button, .tbtn { font-size:20px; padding:10px 18px; border-radius:6px; border:2px solid #888;
    background:#2a2d4a; color:#fff; cursor:pointer; font-family:inherit; }
  #detail button:active, .tbtn:active { background:#3d4066; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#8cbff2; font-size:20px; color:#123; z-index:20; }
  #touch { display:none; }
  body.touch #touch { display:block; }
  body.touch #hint { display:none; }
  #stick { position:fixed; left:36px; bottom:36px; width:160px; height:160px; border-radius:50%;
    background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.4); z-index:8; }
  #knob { position:absolute; left:48px; top:48px; width:64px; height:64px; border-radius:50%;
    background:rgba(255,255,255,.45); }
  .tbtn { position:fixed; right:36px; width:140px; height:72px; z-index:8; font-size:22px; }
  #jumpBtn { bottom:130px; }
  #openBtn { bottom:36px; font-size:24px; display:none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">読み込み中…</div>

<div id="hud" class="panel"><div class="t">ふぇんの書庫</div><div class="c" id="hudCount">あつめた本: 0 / 1</div></div>
<div id="hint">WASD / 矢印キー: 移動&nbsp;&nbsp; Space: ジャンプ&nbsp;&nbsp; 本の前で Z: ひらく&nbsp;&nbsp; Esc: 終了</div>
<div id="prompt" class="panel">Z : 本をひらく</div>
<div id="toast"></div>

<div id="detail" class="panel">
  <h1>『あしたの湯けむり』</h1>
  <div class="genre">ビジュアルノベル</div>
  <div class="desc">温泉旅館が舞台。営業1年目の二宮こはるが、「お盆まで」の期限と取引先のトラブルに追われる夏の物語。用語解説つき、全10章＋エピローグ。</div>
  <div class="fen">ふぇん: 書庫の1冊はこれ。湯けむりの向こうの、こはるの夏を見届けてやって。</div>
  <div class="row">
    <button id="openWork">ブラウザでひらく</button>
    <button id="closeDetail">とじる (X)</button>
  </div>
</div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <button class="tbtn" id="jumpBtn">ジャンプ</button>
  <button class="tbtn" id="openBtn">ひらく</button>
</div>

<audio id="bgm" src="audio/field.wav" loop preload="auto"></audio>
<audio id="chime" src="audio/levelup.wav" preload="auto"></audio>

<script type="importmap">
{ "imports": {
  "three": "./three.module.js",
  "three/addons/": "./addons/"
} }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
